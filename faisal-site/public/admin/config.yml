backend:
  name: github
  repo: FaisalZTN/abanggfaisal-website
  branch: main
  base_url: https://auth.abanggfaisal.my.id
  auth_endpoint: auth
media_folder: faisal-site/public/uploads
public_folder: /uploads
site_url: https://abanggfaisal.my.id
locale: id
collections:
  - name: journal
    label: Journal
    folder: faisal-site/content/journal
    create: true
    extension: json
    format: json
    identifier_field: id
    slug: '{{id}}'
    summary: "{{title}} · {{status}}"
    sortable_fields: [title, status]
    fields:
      - {label: Slug URL, name: id, widget: string, pattern: ['^[a-z0-9-]+$', 'Gunakan huruf kecil, angka, dan tanda hubung']}
      - {label: Judul, name: title, widget: string}
      - {label: Kategori, name: category, widget: select, options: [Reflections, Opinion, Life, Learning]}
      - {label: Tanggal, name: date, widget: datetime, format: YYYY-MM-DD, time_format: false}
      - {label: Menit baca lama (sekarang dihitung otomatis), name: minutes, widget: hidden, default: 3}
      - {label: Ringkasan, name: short, widget: text}
      - label: Isi tulisan
        name: article
        widget: markdown
        required: false
        buttons: [bold, italic, strikethrough, code, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
        editor_components: [image, code-block, table]
        hint: "Isi editor ini menggantikan tampilan paragraf lama. Biarkan kosong untuk memakai tulisan lama. Mendukung tabel, gambar lokal, kode dan daftar bertingkat. Mode Markdown tersedia untuk penyuntingan struktur. HTML mentah dan embed pihak ketiga tidak dijalankan."
      - {label: Cover tulisan, name: cover, widget: image, required: false, choose_url: false, hint: "JPG/PNG/WebP/AVIF/GIF; nama file tanpa spasi. Kompresi WebP otomatis saat build; gunakan nama tanpa spasi dan unggahan di bawah 10 MB. Disarankan rasio 3:2."}
      - {label: Deskripsi cover, name: cover_alt, widget: string, required: false}
      - {label: Paragraf lama (dipakai jika editor baru kosong), name: body, widget: list, required: false, field: {label: Paragraf, name: paragraph, widget: text}}
      - {label: Palet visual, name: art, widget: number, value_type: int, default: 1, min: 0, max: 6}
      - {label: Judul SEO, name: seo_title, widget: string, required: false, hint: "Kosong = judul konten; usahakan sekitar 60 karakter."}
      - {label: Deskripsi SEO, name: seo_description, widget: text, required: false, hint: "Kosong = ringkasan; usahakan sekitar 150–160 karakter."}
      - {label: Status, name: status, widget: select, options: [draft, published], default: draft}
  - name: products
    label: Produk
    folder: faisal-site/content/products
    create: true
    extension: json
    format: json
    identifier_field: id
    slug: '{{id}}'
    summary: "{{title}} · {{status}}"
    sortable_fields: [title, status]
    fields:
      - {label: Slug URL, name: id, widget: string, pattern: ['^[a-z0-9-]+$', 'Gunakan huruf kecil, angka, dan tanda hubung']}
      - {label: Produk unggulan, name: featured, widget: boolean, default: false, required: false}
      - {label: Ketersediaan, name: availability, widget: select, options: [coming-soon, available, unavailable], required: false, hint: "available memerlukan checkout HTTPS. Kosong mengikuti tautan checkout untuk data lama."}
      - {label: Thumbnail, name: thumbnail, widget: image, required: false, choose_url: false}
      - {label: Deskripsi thumbnail, name: thumbnail_alt, widget: string, required: false}
      - label: Preview produk
        name: previews
        widget: list
        required: false
        fields:
          - {label: Gambar, name: image, widget: image, choose_url: false}
          - {label: Deskripsi gambar, name: alt, widget: string}
          - {label: Keterangan, name: caption, widget: string, required: false}
      - {label: Nama produk, name: title, widget: string}
      - {label: Kategori, name: category, widget: select, options: [E-book, Templates, Design, Learning, Layanan]}
      - {label: Ringkasan, name: short, widget: text}
      - {label: Deskripsi, name: description, widget: text}
      - {label: Harga rupiah, name: price, widget: number, value_type: int, min: 0, default: 0}
      - {label: Format file atau layanan, name: format, widget: string}
      - {label: Lisensi, name: license, widget: text}
      - {label: Halaman informasi Mayar HTTPS, name: catalog_url, widget: string, required: false, pattern: ['^https://.+$', 'Gunakan URL HTTPS']}
      - {label: Instruksi pembayaran dan aktivasi, name: fulfillment_note, widget: text, required: false, hint: "Jelaskan status pembayaran, pengiriman file atau aktivasi manual dan kontak layanan."}
      - {label: Tautan checkout HTTPS, name: checkout, widget: string, required: false, pattern: ['^https://.+$', 'Gunakan URL HTTPS']}
      - {label: Palet visual, name: art, widget: number, value_type: int, default: 2, min: 0, max: 6}
      - {label: Judul SEO, name: seo_title, widget: string, required: false, hint: "Kosong = judul konten; usahakan sekitar 60 karakter."}
      - {label: Deskripsi SEO, name: seo_description, widget: text, required: false, hint: "Kosong = ringkasan; usahakan sekitar 150–160 karakter."}
      - {label: Status, name: status, widget: select, options: [draft, published], default: draft}
  - name: settings
    label: Profil personal
    files:
      - name: profile
        label: About & kontak
        file: faisal-site/content/profile.json
        fields:
          - {label: Pengantar, name: intro, widget: text}
          - {label: Cerita personal, name: story, widget: list, field: {label: Paragraf, name: paragraph, widget: text}}
          - {label: Bidang minat, name: interests, widget: list, field: {label: Bidang, name: interest, widget: string}}
          - {label: URL kontak publik HTTPS, name: contact_url, widget: string, required: false}
          - {label: Saya menyetujui publikasi tautan kontak ini, name: contact_approved, widget: boolean, default: false}

  - name: study_blocks
    label: Blok Ruang Belajar
    folder: faisal-site/content/study-blocks
    create: true
    delete: false
    extension: json
    format: json
    identifier_field: id
    slug: '{{id}}'
    fields:
      - {label: ID blok, name: id, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Gunakan huruf kecil, angka, dan tanda hubung'], hint: 'Pertahankan ID setelah dibuat karena dipakai oleh URL dan data kuliah.'}
      - {label: Nama blok, name: title, widget: string}
      - {label: Semester, name: semester, widget: string, required: false}
      - {label: Periode, name: period, widget: string, required: false}
      - {label: Nama modul, name: module_label, widget: string, required: false}
      - {label: Nama sumber jadwal, name: schedule_source, widget: string, required: false}
      - label: Status blok
        name: status
        widget: select
        default: coming-soon
        options:
          - {label: Segera hadir, value: coming-soon}
          - {label: Aktif, value: active}

  - name: study_teachers
    label: Pengajar Ruang Belajar
    folder: faisal-site/content/study-teachers
    create: true
    extension: json
    format: json
    identifier_field: id
    slug: '{{id}}'
    summary: '{{title}} · {{department}}'
    fields:
      - {label: ID tetap, name: id, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Gunakan huruf kecil, angka, dan tanda hubung']}
      - label: Blok belajar
        name: block
        widget: relation
        collection: study_blocks
        search_fields: [title, id]
        display_fields: [title]
        value_field: id
        required: false
        hint: 'Kosong berarti KSI.'
      - {label: Nama dan gelar sesuai modul, name: title, widget: string}
      - {label: Departemen, name: department, widget: string}
      - {label: Catatan sumber, name: note, widget: text, required: false}

  - name: study_lectures
    label: Materi Kuliah Ruang Belajar
    folder: faisal-site/content/study-lectures
    create: true
    extension: json
    format: json
    identifier_field: id
    slug: '{{id}}'
    summary: '{{number}} · {{title}}'
    fields:
      - {label: ID tetap, name: id, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Gunakan huruf kecil, angka, dan tanda hubung']}
      - {label: Judul, name: title, widget: string}
      - {label: Departemen, name: department, widget: string}
      - label: Blok belajar
        name: block
        widget: relation
        collection: study_blocks
        search_fields: [title, id]
        display_fields: [title]
        value_field: id
        required: false
        hint: 'Kosong berarti KSI.'
      - {label: Nomor di modul, name: number, widget: number, value_type: int, min: 1}
      - {label: Halaman cetak di modul, name: source_page, widget: string}
      - {label: Tanggal kuliah terverifikasi, name: lecture_date, widget: string, required: false, hint: 'Isi YYYY-MM-DD dan halaman PDF jika topik dan dosen cocok dengan jadwal.', pattern: ['^[0-9]{4}-[0-9]{2}-[0-9]{2}$', 'Gunakan YYYY-MM-DD']}
      - {label: Halaman PDF jadwal, name: schedule_page, widget: number, value_type: int, min: 1, required: false}
      - {label: Jam mulai kuliah (WITA), name: lecture_start, widget: string, required: false, pattern: ['^(?:[01][0-9]|2[0-3]):[0-5][0-9]$', 'Gunakan HH:MM, misalnya 08:00']}
      - {label: Jam selesai kuliah (WITA), name: lecture_end, widget: string, required: false, pattern: ['^(?:[01][0-9]|2[0-3]):[0-5][0-9]$', 'Gunakan HH:MM, misalnya 10:00']}
      - {label: Tempat kuliah, name: lecture_location, widget: string, required: false}
      - label: Dosen pengajar
        name: teachers
        widget: relation
        collection: study_teachers
        search_fields: [title, department]
        display_fields: [title, department]
        value_field: id
        multiple: true
        min: 1
      - {label: Catatan belajar dan referensi, name: notes, widget: markdown, required: false}
      - {label: Target belajar dari modul, name: objectives, widget: list, required: false}
      - {label: Kata kunci pencarian, name: keywords, widget: list, required: false}
      - label: Tautan bahan belajar
        name: materials
        widget: list
        required: false
        fields:
          - {label: Judul tautan, name: label, widget: string}
          - {label: URL HTTPS, name: url, widget: string, pattern: ['^https://\S+$', 'Masukkan tautan HTTPS']}
      - {label: Status, name: status, widget: select, options: [draft, published], default: draft}

  - name: study_guidelines
    label: Kumpulan Guideline
    files:
      - name: study_guideline_list
        label: Daftar guideline Ruang Belajar
        file: faisal-site/content/study-guidelines.json
        fields:
          - label: Guideline
            name: entries
            widget: list
            required: false
            fields:
              - {label: Judul guideline, name: title, widget: string}
              - {label: Penerbit dan tahun, name: issuer, widget: string, required: false}
              - label: Jenis rujukan
                name: kind
                widget: select
                required: false
                options:
                  - {label: Pedoman atau dokumen, value: document}
                  - {label: Portal rujukan profesi, value: portal}
              - {label: Terakhir ditinjau, name: reviewed_on, widget: string, required: false, pattern: ['^[0-9]{4}-[0-9]{2}-[0-9]{2}$', 'Gunakan YYYY-MM-DD']}
              - label: Status peninjauan
                name: review_status
                widget: select
                required: false
                options:
                  - {label: Berlaku, value: berlaku}
                  - {label: Perlu dicek, value: perlu-dicek}
                  - {label: Digantikan, value: digantikan}
              - {label: URL HTTPS, name: url, widget: string, pattern: ['^https://\S+$', 'Masukkan tautan HTTPS']}

  - name: study_tutorials
    label: Tutorial Ruang Belajar
    folder: faisal-site/content/study-tutorials
    create: true
    extension: json
    format: json
    identifier_field: id
    slug: '{{id}}'
    summary: '{{number}} · {{title}}'
    fields:
      - {label: ID tetap, name: id, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Gunakan huruf kecil, angka, dan tanda hubung']}
      - {label: Judul, name: title, widget: string}
      - label: Blok belajar
        name: block
        widget: relation
        collection: study_blocks
        search_fields: [title, id]
        display_fields: [title]
        value_field: id
        required: false
        hint: 'Kosong berarti KSI.'
      - {label: Nomor skenario, name: number, widget: number, value_type: int, min: 1}
      - {label: Pengantar, name: short, widget: text}
      - {label: Catatan belajar, name: article, widget: markdown}
      - label: Topik Persiapan Tutorial 2
        name: topics
        widget: list
        required: false
        summary: '{{fields.title}}'
        fields:
          - {label: Judul topik, name: title, widget: string}
          - {label: Isi topik, name: body, widget: markdown}
      - label: Kuliah terkait
        name: related
        widget: relation
        collection: study_lectures
        search_fields: [title, block]
        display_fields: [title, block]
        value_field: id
        multiple: true
        required: false
        hint: Pilih kuliah dari blok yang sama.
      - {label: Status, name: status, widget: select, options: [draft, published], default: draft}
